<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <title>Analytics</title>
    <style>
      body {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px;
        font-family: Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif;
        line-height: 1.6;
        color: #1b264f;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Analytics</h1>
    <p id="status">Checking…</p>
    <button id="toggle" type="button" hidden></button>

    <script type="module">
      // Plausible's script skips tracking in browsers with this set
      const KEY = 'plausible_ignore';
      const status = document.getElementById('status');
      const toggle = document.getElementById('toggle');

      function render() {
        let ignored;
        try {
          ignored = localStorage.getItem(KEY) === 'true';
        } catch {
          status.textContent = "This browser won't let the page use local storage, so tracking can't be turned off here.";
          return;
        }
        status.textContent = ignored ? 'Visits from this browser are not tracked.' : 'Visits from this browser are tracked.';
        toggle.textContent = ignored ? 'Track this browser' : 'Stop tracking this browser';
        toggle.hidden = false;
      }

      toggle.addEventListener('click', () => {
        try {
          if (localStorage.getItem(KEY) === 'true') localStorage.removeItem(KEY);
          else localStorage.setItem(KEY, 'true');
        } catch {}
        render();
      });

      render();
    </script>
  </body>
</html>
